<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 안병옥 강사</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js" defer></script>
</head>
<body class="auth-page">

<nav class="navbar">
  <a href="/" class="logo">안병옥 <span>강사</span></a>
  <div class="nav-links">
    <a href="/list/">둘러보기</a>
    <a href="/#curriculum">커리큘럼</a>
    <a href="/#contact">문의</a>
  </div>
  <div class="auth-nav" data-auth-nav></div>
</nav>

<main class="auth-main">
  <section class="auth-panel">
    <span class="section-kicker">LOGIN</span>
    <h1>로그인</h1>
    <p>계정으로 로그인하면 글을 등록할 수 있습니다.</p>

    <form id="login-form" class="auth-form">
      <label>이메일
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>비밀번호
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="cta-button">로그인</button>
      <p id="login-status" class="form-status"></p>
    </form>

    <a class="form-link" href="/signup/">계정이 없으면 회원가입</a>
  </section>
</main>

<script>
const loginForm = document.getElementById('login-form');
const loginStatus = document.getElementById('login-status');

document.addEventListener('app-auth-ready', async (event) => {
  if (event.detail.error) {
    loginForm.querySelectorAll('input, button').forEach((element) => {
      element.disabled = true;
    });
    loginStatus.textContent = window.appAuth.getFriendlyAuthError(event.detail.error);
    return;
  }

  if (event.detail.session) {
    window.location.href = window.appAuth.getRedirectPath();
  }
});

loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  loginStatus.textContent = '로그인 중입니다...';

  const formData = new FormData(loginForm);
  const email = formData.get('email');
  const password = formData.get('password');

  try {
    const client = await window.appAuth.getSupabaseClient();
    const { error } = await client.auth.signInWithPassword({
      email,
      password,
    });

    if (error) throw error;

    window.location.href = window.appAuth.getRedirectPath();
  } catch (error) {
    loginStatus.textContent = error.message || '로그인에 실패했습니다.';
  }
});
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vibe3</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f4ef;
        color: #171717;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(48px, 12vw, 112px);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 520px;
        font-size: clamp(18px, 3vw, 24px);
        line-height: 1.45;
        color: #4a4a4a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111111;
          color: #fafafa;
        }

        p {
          color: #c9c9c9;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>vibe3</h1>
      <p>GitHub에서 Vercel까지 연결된 첫 배포입니다.</p>
    </main>
  </body>
</html>

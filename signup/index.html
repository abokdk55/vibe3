<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | 안병옥 강사</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js" defer></script>
</head>
<body class="auth-page">

<nav class="navbar">
  <a href="/" class="logo">안병옥 <span>강사</span></a>
  <div class="nav-links">
    <a href="/list/">둘러보기</a>
    <a href="/#curriculum">커리큘럼</a>
    <a href="/#contact">문의</a>
  </div>
  <div class="auth-nav" data-auth-nav></div>
</nav>

<main class="auth-main">
  <section class="auth-panel">
    <span class="section-kicker">SIGN UP</span>
    <h1>회원가입</h1>
    <p>이메일과 비밀번호로 계정을 만드세요.</p>

    <form id="signup-form" class="auth-form">
      <label>이메일
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>비밀번호
        <input type="password" name="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button type="submit" class="cta-button">회원가입</button>
      <p id="signup-status" class="form-status"></p>
    </form>

    <a class="form-link" href="/login/">이미 계정이 있어요</a>
  </section>
</main>

<script>
const signupForm = document.getElementById('signup-form');
const signupStatus = document.getElementById('signup-status');

signupForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  signupStatus.textContent = '가입 처리 중입니다...';

  const formData = new FormData(signupForm);
  const email = formData.get('email');
  const password = formData.get('password');

  try {
    const client = await window.appAuth.getSupabaseClient();
    const { data, error } = await client.auth.signUp({
      email,
      password,
    });

    if (error) throw error;

    if (data.session) {
      window.location.href = window.appAuth.getRedirectPath();
      return;
    }

    signupStatus.textContent = '가입 확인 메일을 보냈습니다. 메일함을 확인해주세요.';
  } catch (error) {
    signupStatus.textContent = error.message || '회원가입에 실패했습니다.';
  }
});
</script>

</body>
</html>
